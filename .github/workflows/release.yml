name: Release artifacts

on:
  push:
    branches: [rust-migration]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact tested commit SHA (40 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            wheel-tag: macosx_11_0_arm64
            manylinux: auto
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            wheel-tag: macosx_11_0_x86_64
            manylinux: auto
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            wheel-tag: manylinux_2_28_x86_64
            manylinux: '2_28'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Verify exact revision
        env:
          RELEASE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked native wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - name: Install and semantically test wheel outside checkout
        env:
          EXPECTED_WHEEL_TAG: ${{ matrix.wheel-tag }}
        run: |
          test -f "dist/repl_mcp-3.0.0-py3-none-${EXPECTED_WHEEL_TAG}.whl"
          python -m venv "$RUNNER_TEMP/artifact-venv"
          "$RUNNER_TEMP/artifact-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/artifact-venv/bin/python" "$GITHUB_WORKSPACE/tests/fixtures/installed_smoke.py"
      - uses: actions/upload-artifact@v7
        with:
          name: repl-mcp-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Verify exact revision
        env:
          RELEASE_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source archive
        run: |
          python -m pip install 'maturin==1.15.0'
          maturin sdist --out dist
      - name: Install archive and test outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/artifact-venv"
          "$RUNNER_TEMP/artifact-venv/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/artifact-venv/bin/python" "$GITHUB_WORKSPACE/tests/fixtures/installed_smoke.py"
      - uses: actions/upload-artifact@v7
        with:
          name: repl-mcp-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
