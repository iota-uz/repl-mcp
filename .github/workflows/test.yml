name: Tests

on:
  push:
    branches: [main, develop, rust-migration]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
        mcp-version: ["2.2.0", "2.3.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and check native runtime
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
      - name: Install wheel and test dependencies
        run: |
          python -m pip install 'maturin==1.15.0'
          maturin build --locked --out dist
          python -m pip install dist/*.whl
          python -m pip install -e '.[dev]'
          python -m pip install 'mcp==${{ matrix.mcp-version }}'
      - name: Required Python lint
        run: ruff check src/repl_mcp/native_worker.py tests/test_native*.py
      - name: Full regression and protocol suite
        env:
          REPL_MCP_BINARY: ${{ github.workspace }}/target/debug/repl-mcp
          PYTHONPATH: src
        run: python -m pytest tests/ -q
        timeout-minutes: 15
      - name: Installed CLI smoke test
        run: repl-mcp --help

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'maturin==1.15.0'
      - run: maturin sdist --out dist
      - name: Build from source distribution and verify entrypoint
        run: |
          python -m pip install dist/*.tar.gz
          repl-mcp --help
