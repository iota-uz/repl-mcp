[project]
name = "repl-mcp"
version = "3.0.1"
requires-python = ">=3.10"
description = "Native Rust MCP supervisor with a persistent Python worker"
license = "MIT"
dependencies = [
    "httpx==0.28.1",
    # Recurring real-world REPL use case (xlsx analysis); envs are ephemeral
    # per uvx build, so user installs don't persist — ship it.
    "openpyxl==3.1.5",
    # Pin the complete runtime closure in wheel metadata too: uvx does not read uv.lock.
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "httpcore==1.0.9",
    "idna==3.19",
    "h11==0.16.0",
    "et-xmlfile==2.0.0",
    "exceptiongroup==1.3.1; python_version < '3.11'",
    "typing-extensions==4.16.0; python_version < '3.15'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
    "fastmcp==4.0.3",
    "mcp==2.2.0",
    "httpx2==2.5.0",
    "pydantic>=2.0.0",
    "ruff==0.15.6",
]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
strip = true
locked = true

[tool.ruff]
target-version = "py310"
include = ["src/repl_mcp/native_worker.py", "tests/test_native*.py"]
