[project]
name = "repl-mcp"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp>=1.7.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "nest-asyncio>=1.6.0",
    "gitpython>=3.1.0",
    "tree-sitter-language-pack>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
]

[project.scripts]
repl-mcp = "repl_mcp.repl_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
